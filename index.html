<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineLocal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

  <nav>
    <a class="logo" href="#">CINE<span>LOCAL</span></a>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search" placeholder="Rechercher un film…" autocomplete="off" />
    </div>
    <div class="nav-right">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="pc"    onclick="setMode('pc')">🖥️</button>
        <button class="mode-btn"        data-mode="tv"    onclick="setMode('tv')">📺</button>
        <button class="mode-btn"        data-mode="local" onclick="setMode('local')">📽️<span class="btn-label"> TV directe</span></button>
      </div>
      <button class="btn-refresh" onclick="refreshMovies()">↺</button>
      <google-cast-launcher id="castBtn" style="display:none"></google-cast-launcher>
      <button class="btn-refresh" onclick="fetch('/stop',{method:'POST'})">⏹<span class="btn-label"> Stop TV</span></button>
    </div>
  </nav>

  <section id="hero">
    <div class="hero-layer visible" id="hero-layer-0"></div>
    <div class="hero-layer" id="hero-layer-1"></div>
    <div id="hero-grad"></div>
  </section>

  <main id="catalogue">
    <div id="loading"><div class="spinner"></div>Chargement de la bibliothèque…</div>
    <div id="empty" style="display:none">Aucun film trouvé dans ~/nvme_data</div>
    <div id="movies-container"></div>
  </main>

  <!-- PLAYER MODAL -->
  <div id="player-modal">
    <div class="player-container">
      <div class="player-header">
        <div class="player-title" id="player-title"></div>
        <button class="icon-btn" onclick="closePlayer()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <video id="player-video" controls preload="auto" crossorigin="anonymous"></video>
      <div class="player-loading" id="playerLoading">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Préparation du film…</div>
        <div class="loading-substep" id="loadingSubstep">Chargement de la vidéo et extraction des pistes</div>
        <div class="loading-steps">
          <div class="loading-step" id="stepVideo"></div>
          <div class="loading-step" id="stepTracks"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CAST OPTIONS MODAL -->
  <div id="cast-options-modal">
    <div class="cast-options-container">
      <div class="cast-options-header">
        <div>
          <div class="cast-options-title" id="optionsTitle">📺 Options Cast</div>
          <div class="cast-options-film" id="castOptionsFilm"></div>
        </div>
        <button class="icon-btn" onclick="closeCastOptions()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="cast-options-body" id="castOptionsBody">
        <div class="cast-loading-msg">Chargement des pistes…</div>
      </div>
      <div class="cast-options-footer">
        <button class="btn-cast-cancel" onclick="closeCastOptions()">Annuler</button>
        <button class="btn-cast-launch" id="btnCastLaunch" onclick="launchOptions()" disabled>
          <span id="btnLaunchLabel">📺 Lancer le Cast</span>
        </button>
      </div>
    </div>
  </div>

  <!-- SERIES MODAL -->
  <div id="series-modal">
    <div class="series-container">
      <div class="series-header" id="seriesHeader">
        <button class="icon-btn series-close" onclick="closeSeriesModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="series-header-content">
          <div class="series-modal-title" id="seriesModalTitle"></div>
          <div class="series-meta" id="seriesModalMeta"></div>
          <div class="series-overview" id="seriesModalOverview"></div>
        </div>
      </div>
      <div class="season-tabs" id="seasonTabs"></div>
      <div class="episodes-list" id="episodesList"></div>
    </div>
  </div>

  <div class="cast-status-bar" id="castStatus">
    <div class="cast-dot"></div>
    <span id="castStatusText">Diffusion en cours sur la TV</span>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
