<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineLocal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --bg: #080a0e; --bg2: #0e1117; --bg3: #151b24;
      --surface: #1a2130; --border: rgba(255, 255, 255, 0.07);
      --gold: #c9a84c; --gold2: #f0d080; --red: #e53030;
      --text: #e8e0d0; --muted: #7a7060;
      --radius: 4px; --card-w: 220px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Crimson Pro', serif;
      min-height: 100vh; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.4;
    }

    /* ═══ NAV ═══════════════════════════════════════════════════════════ */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 2rem;
      padding: 0 3rem; height: 64px;
      background: linear-gradient(to bottom, rgba(8,10,14,0.98), transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem;
      letter-spacing: 0.12em; color: var(--gold);
      text-decoration: none; flex-shrink: 0;
    }
    .logo span { color: var(--text); }
    .search-wrap { flex: 1; max-width: 400px; position: relative; }
    .search-wrap input {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 2px;
      color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 0.78rem; padding: 0.5rem 1rem 0.5rem 2.4rem;
      outline: none; transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: var(--gold); }
    .search-wrap svg {
      position: absolute; left: 0.75rem; top: 50%;
      transform: translateY(-50%); color: var(--muted); pointer-events: none;
    }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
    .mode-toggle {
      display: flex; background: var(--surface);
      border: 1px solid var(--border); border-radius: 2px; overflow: hidden;
    }
    .mode-btn {
      background: none; border: none; color: var(--muted);
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.08em; padding: 0.45rem 0.9rem;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .mode-btn.active { background: var(--gold); color: #080a0e; }
    .mode-btn:hover:not(.active) { color: var(--text); }
    .btn-refresh {
      background: none; border: 1px solid var(--border);
      color: var(--muted); font-family: 'DM Mono', monospace;
      font-size: 0.7rem; padding: 0.4rem 0.8rem;
      border-radius: 2px; cursor: pointer; transition: all .2s; letter-spacing: 0.05em;
    }
    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
    google-cast-launcher {
      --connected-color: var(--gold); --disconnected-color: var(--muted);
      width: 24px; height: 24px; cursor: pointer;
    }

    /* ═══ HERO ══════════════════════════════════════════════════════════ */
    #hero {
      height: 100vh; display: flex; align-items: flex-end;
      padding: 0 3rem 5rem; position: relative; overflow: hidden;
    }
    #hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center 20%;
      filter: blur(2px) brightness(0.35);
      transform: scale(1.04); transition: background-image 0.6s ease;
    }
    #hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(8,10,14,0.98) 0%, rgba(8,10,14,0.6) 50%, transparent 100%),
                  linear-gradient(to top, rgba(8,10,14,1) 0%, transparent 40%);
    }
    #hero-content { position: relative; max-width: 540px; }
    #hero-tag {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.75rem;
    }
    #hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 6vw, 5.5rem); line-height: 0.95;
      letter-spacing: 0.04em; color: #fff;
      text-shadow: 0 2px 40px rgba(0,0,0,0.8); margin-bottom: 1rem;
    }
    #hero-meta {
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      color: var(--muted); letter-spacing: 0.08em; margin-bottom: 1.5rem;
    }
    .hero-btns { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn-hero {
      display: flex; align-items: center; gap: 0.5rem; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 1rem;
      letter-spacing: 0.1em; padding: 0.7rem 1.6rem;
      cursor: pointer; border-radius: 2px; transition: all .2s;
    }
    .btn-hero.primary { background: var(--gold); color: #080a0e; }
    .btn-hero.primary:hover { background: var(--gold2); transform: translateY(-1px); }

    /* ═══ CATALOGUE & CARDS ═════════════════════════════════════════════ */
    #catalogue { padding: 0 3rem 4rem; position: relative; z-index: 2; }
    .category-section { margin-bottom: 3rem; }
    .category-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem;
      letter-spacing: 0.15em; color: var(--gold);
      margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem;
    }
    .category-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .category-count { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); }
    .movies-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
      gap: 1rem;
    }
    .movie-card {
      position: relative; width: 100%; aspect-ratio: 2/3;
      border-radius: var(--radius); overflow: hidden;
      cursor: pointer; background: var(--surface);
      transition: transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s;
      border: 1px solid var(--border);
    }
    .movie-card:hover {
      transform: scale(1.04) translateY(-4px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px var(--gold); z-index: 10;
    }
    .card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .3s; }
    .movie-card:hover .card-thumb { filter: brightness(0.5); }
    .card-placeholder {
      width: 100%; height: 100%; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem;
      background: linear-gradient(135deg, var(--bg3), var(--surface));
      font-family: 'Bebas Neue', sans-serif; font-size: 3rem;
      color: var(--muted); padding: 0.5rem; text-align: center;
    }
    .card-placeholder span { font-size: 0.65rem; font-family: 'DM Mono', monospace; }
    .card-info {
      position: absolute; inset: 0; padding: 1rem;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(to top, rgba(8,10,14,0.95) 0%, transparent 50%);
      opacity: 0; transition: opacity .3s;
    }
    .movie-card:hover .card-info { opacity: 1; }
    .card-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem;
      letter-spacing: 0.05em; line-height: 1.1; color: #fff; margin-bottom: 0.25rem;
    }
    .card-meta { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); }
    .card-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    .card-btn {
      flex: 1; border: none; padding: 0.4rem 0;
      font-family: 'Bebas Neue', sans-serif; font-size: 0.8rem;
      letter-spacing: 0.08em; border-radius: 2px;
      cursor: pointer; transition: filter .15s; background: var(--gold); color: #080a0e;
    }
    .card-btn:hover { filter: brightness(1.15); }
    .card-badge {
      position: absolute; top: 0.5rem; right: 0.5rem;
      font-family: 'DM Mono', monospace; font-size: 0.6rem;
      background: rgba(0,0,0,0.7); border: 1px solid var(--border);
      padding: 0.15rem 0.4rem; border-radius: 2px;
      color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase;
    }
    .series-badge {
      position: absolute; bottom: 0.5rem; left: 0.5rem;
      background: var(--gold); color: #080a0e;
      font-family: 'Bebas Neue', sans-serif; font-size: 0.7rem;
      letter-spacing: 0.08em; padding: 0.2rem 0.5rem; border-radius: 2px;
    }

    /* ═══ PLAYER MODAL ══════════════════════════════════════════════════ */
    #player-modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #player-modal.open { opacity: 1; pointer-events: all; }
    .player-container {
      position: relative; width: min(92vw, 1200px);
      background: #000; border-radius: 4px; overflow: hidden;
      box-shadow: 0 40px 120px rgba(0,0,0,0.9);
      transform: scale(0.96); transition: transform .3s;
    }
    #player-modal.open .player-container { transform: scale(1); }
    .player-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }
    .player-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;
      letter-spacing: 0.08em; color: #fff;
    }
    .icon-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; width: 36px; height: 36px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.25); }
    #player-video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }

    /* Overlay chargement */
    .player-loading {
      position: absolute; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.5rem; z-index: 5; transition: opacity 0.4s ease;
    }
    .player-loading.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 56px; height: 56px;
      border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .loading-text {
      font-family: 'DM Mono', monospace; font-size: 0.85rem;
      color: var(--text); letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
    }
    .loading-substep {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--muted); letter-spacing: 0.08em; text-align: center; max-width: 400px;
    }
    .loading-steps { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .loading-step { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
    .loading-step.active { background: var(--gold); }
    .loading-step.done { background: rgba(201,168,76,0.5); }

    /* Sélecteur audio PC */
    .audio-selector {
      position: absolute; bottom: 60px; right: 1rem;
      z-index: 11; display: none; gap: 0.4rem;
      background: rgba(0,0,0,0.85); border: 1px solid var(--border);
      padding: 0.6rem; border-radius: 4px;
      flex-wrap: wrap; max-width: 320px;
    }
    .audio-selector.visible { display: flex; }
    .audio-selector-label {
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      color: var(--gold); letter-spacing: 0.08em; width: 100%; margin-bottom: 0.25rem;
    }
    .audio-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 0.3rem 0.6rem; font-size: 0.75rem;
      cursor: pointer; border-radius: 2px; font-family: 'DM Mono', monospace; transition: all .15s;
    }
    .audio-btn:hover { background: rgba(255,255,255,0.2); }
    .audio-btn.active { background: var(--gold); color: #080a0e; border-color: var(--gold); }

    /* ═══ CAST OPTIONS MODAL ════════════════════════════════════════════ */
    #cast-options-modal {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .3s; padding: 2rem;
    }
    #cast-options-modal.open { opacity: 1; pointer-events: all; }
    .cast-options-container {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; width: min(95vw, 540px);
      transform: scale(0.95); transition: transform .3s; overflow: hidden;
    }
    #cast-options-modal.open .cast-options-container { transform: scale(1); }
    .cast-options-header {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .cast-options-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 0.08em; color: var(--gold);
    }
    .cast-options-film {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--muted); margin-top: 0.2rem; letter-spacing: 0.05em;
    }
    .cast-options-body { padding: 1.2rem 1.5rem; max-height: 60vh; overflow-y: auto; }
    .cast-section { margin-bottom: 1.4rem; }
    .cast-section-label {
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      color: var(--gold); letter-spacing: 0.15em;
      text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .cast-option-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border); border-radius: 3px;
      margin-bottom: 0.4rem; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .cast-option-row:hover { border-color: rgba(201,168,76,0.4); background: rgba(201,168,76,0.05); }
    .cast-option-row.selected { border-color: var(--gold); background: rgba(201,168,76,0.08); }
    .cast-option-radio {
      width: 16px; height: 16px;
      border: 2px solid var(--muted); border-radius: 50%;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .cast-option-row.selected .cast-option-radio { border-color: var(--gold); }
    .cast-option-radio-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold); opacity: 0; transition: opacity .15s;
    }
    .cast-option-row.selected .cast-option-radio-dot { opacity: 1; }
    .cast-option-text { flex: 1; }
    .cast-option-name { font-family: 'Crimson Pro', serif; font-size: 0.95rem; color: var(--text); }
    .cast-option-meta { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); margin-top: 0.1rem; }
    .cast-options-footer {
      padding: 1rem 1.5rem; border-top: 1px solid var(--border);
      display: flex; gap: 0.75rem; justify-content: flex-end;
    }
    .btn-cast-cancel {
      background: none; border: 1px solid var(--border);
      color: var(--muted); font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem; letter-spacing: 0.1em;
      padding: 0.6rem 1.4rem; border-radius: 2px;
      cursor: pointer; transition: all .2s;
    }
    .btn-cast-cancel:hover { border-color: var(--muted); color: var(--text); }
    .btn-cast-launch {
      background: var(--gold); border: none; color: #080a0e;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem; letter-spacing: 0.1em;
      padding: 0.6rem 1.8rem; border-radius: 2px;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .btn-cast-launch:hover { background: var(--gold2); transform: translateY(-1px); }
    .btn-cast-launch:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .cast-loading-msg {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--muted); text-align: center; padding: 1.5rem;
      letter-spacing: 0.08em;
    }
    .cast-empty-msg {
      font-family: 'DM Mono', monospace; font-size: 0.65rem;
      color: var(--muted); padding: 0.4rem 0.75rem; font-style: italic;
    }

    /* ═══ CAST STATUS BAR ═══════════════════════════════════════════════ */
    .cast-status-bar {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%); z-index: 150;
      background: var(--surface); border: 1px solid var(--gold);
      border-radius: 4px; padding: 0.75rem 1.5rem;
      display: none; align-items: center; gap: 0.75rem;
      font-family: 'DM Mono', monospace; font-size: 0.75rem;
      color: var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .cast-status-bar.visible { display: flex; }
    .cast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    #loading, #empty {
      padding: 8rem 3rem; text-align: center;
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      color: var(--muted); letter-spacing: 0.08em;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    @media (max-width: 768px) {
      nav { padding: 0 1rem; gap: 1rem; }
      #hero { padding: 0 1.2rem 4rem; }
      #catalogue { padding: 0 1.2rem 3rem; }
      :root { --card-w: 140px; }
      .search-wrap { max-width: none; }
      .mode-btn { padding: 0.4rem 0.6rem; font-size: 0.65rem; }
    }

    /* ═══ SERIES MODAL ══════════════════════════════════════════════════ */
    #series-modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .3s; padding: 2rem;
    }
    #series-modal.open { opacity: 1; pointer-events: all; }
    .series-container {
      width: min(95vw, 1100px); max-height: 90vh;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden;
      display: flex; flex-direction: column;
      transform: scale(0.96); transition: transform .3s;
    }
    #series-modal.open .series-container { transform: scale(1); }
    .series-header {
      position: relative; padding: 2rem;
      background-size: cover; background-position: center 20%;
      border-bottom: 1px solid var(--border);
      min-height: 220px; display: flex; align-items: flex-end;
    }
    .series-header::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg2) 0%, rgba(14,17,23,0.4) 100%);
    }
    .series-header-content { position: relative; z-index: 1; flex: 1; }
    .series-modal-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem;
      letter-spacing: 0.04em; color: #fff; margin-bottom: 0.5rem;
    }
    .series-meta {
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--gold); letter-spacing: 0.08em; margin-bottom: 0.75rem;
    }
    .series-overview {
      font-family: 'Crimson Pro', serif; font-size: 0.9rem;
      color: var(--text); max-width: 700px; line-height: 1.4;
    }
    .series-close { position: absolute; top: 1rem; right: 1rem; z-index: 2; }
    .season-tabs {
      display: flex; gap: 0.5rem; padding: 1rem 2rem 0;
      border-bottom: 1px solid var(--border); overflow-x: auto;
    }
    .season-tab {
      background: none; border: none; color: var(--muted);
      font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem;
      letter-spacing: 0.1em; padding: 0.6rem 1rem;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .2s; white-space: nowrap;
    }
    .season-tab:hover { color: var(--text); }
    .season-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .episodes-list { overflow-y: auto; padding: 1rem 2rem 2rem; flex: 1; }
    .episode-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .15s; border-radius: 3px;
    }
    .episode-row:hover { background: var(--surface); }
    .episode-num {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
      color: var(--gold); min-width: 50px; letter-spacing: 0.05em;
    }
    .episode-info { flex: 1; }
    .episode-title { font-family: 'Crimson Pro', serif; font-size: 1rem; color: var(--text); margin-bottom: 0.2rem; }
    .episode-meta { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); }
    .episode-play {
      background: var(--gold); color: #080a0e; border: none;
      font-family: 'Bebas Neue', sans-serif; font-size: 0.8rem;
      letter-spacing: 0.1em; padding: 0.4rem 1rem;
      cursor: pointer; border-radius: 2px; transition: filter .15s;
    }
    .episode-play:hover { filter: brightness(1.15); }
  </style>
</head>

<body>

  <nav>
    <a class="logo" href="#">CINE<span>LOCAL</span></a>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search" placeholder="Rechercher un film…" autocomplete="off" />
    </div>
    <div class="nav-right">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="pc"    onclick="setMode('pc')">🖥️</button>
        <button class="mode-btn"        data-mode="tv"    onclick="setMode('tv')">📺</button>
        <button class="mode-btn"        data-mode="local" onclick="setMode('local')">📽️ TV directe</button>
      </div>
      <div class="mode-toggle" id="langToggle">
        <button class="mode-btn active" data-lang="all" onclick="setLang('all')">Tout</button>
        <button class="mode-btn"        data-lang="vf"  onclick="setLang('vf')">🇫🇷</button>
        <button class="mode-btn"        data-lang="en"  onclick="setLang('en')">🇬🇧</button>
      </div>
      <div class="mode-toggle" id="kindToggle">
        <button class="mode-btn active" data-kind="all"   onclick="setKind('all')">Tout</button>
        <button class="mode-btn"        data-kind="movie" onclick="setKind('movie')">Films</button>
        <button class="mode-btn"        data-kind="tv"    onclick="setKind('tv')">Séries</button>
      </div>
      <button class="btn-refresh" onclick="refreshMovies()">↺</button>
      <google-cast-launcher id="castBtn" style="display:none"></google-cast-launcher>
      <button class="btn-refresh" onclick="fetch('/stop',{method:'POST'})">⏹ Stop TV</button>
    </div>
  </nav>

  <section id="hero">
    <div id="hero-bg"></div>
    <div id="hero-grad"></div>
    <div id="hero-content">
      <div id="hero-tag">À la une</div>
      <div id="hero-title">Chargement…</div>
      <div id="hero-meta"></div>
      <div class="hero-btns">
        <button class="btn-hero primary" onclick="playHero()">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
          <span id="heroPrimaryLabel">LIRE</span>
        </button>
      </div>
    </div>
  </section>

  <main id="catalogue">
    <div id="loading"><div class="spinner"></div>Chargement de la bibliothèque…</div>
    <div id="empty" style="display:none">Aucun film trouvé dans ~/nvme_data</div>
    <div id="movies-container"></div>
  </main>

  <!-- PLAYER MODAL -->
  <div id="player-modal">
    <div class="player-container">
      <div class="player-header">
        <div class="player-title" id="player-title"></div>
        <button class="icon-btn" onclick="closePlayer()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <video id="player-video" controls preload="auto" crossorigin="anonymous"></video>
      <div class="player-loading" id="playerLoading">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Préparation du film…</div>
        <div class="loading-substep" id="loadingSubstep">Chargement de la vidéo et extraction des pistes</div>
        <div class="loading-steps">
          <div class="loading-step" id="stepVideo"></div>
          <div class="loading-step" id="stepTracks"></div>
        </div>
      </div>
      <div class="audio-selector" id="audioSelector">
        <div class="audio-selector-label">▣ PISTE AUDIO</div>
      </div>
    </div>
  </div>

  <!-- CAST OPTIONS MODAL -->
  <div id="cast-options-modal">
    <div class="cast-options-container">
      <div class="cast-options-header">
        <div>
          <div class="cast-options-title">📺 Options Cast</div>
          <div class="cast-options-film" id="castOptionsFilm"></div>
        </div>
        <button class="icon-btn" onclick="closeCastOptions()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="cast-options-body" id="castOptionsBody">
        <div class="cast-loading-msg">Chargement des pistes…</div>
      </div>
      <div class="cast-options-footer">
        <button class="btn-cast-cancel" onclick="closeCastOptions()">Annuler</button>
        <button class="btn-cast-launch" id="btnCastLaunch" onclick="launchCast()" disabled>
          📺 Lancer le Cast
        </button>
      </div>
    </div>
  </div>

  <!-- SERIES MODAL -->
  <div id="series-modal">
    <div class="series-container">
      <div class="series-header" id="seriesHeader">
        <button class="icon-btn series-close" onclick="closeSeriesModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="series-header-content">
          <div class="series-modal-title" id="seriesModalTitle"></div>
          <div class="series-meta" id="seriesModalMeta"></div>
          <div class="series-overview" id="seriesModalOverview"></div>
        </div>
      </div>
      <div class="season-tabs" id="seasonTabs"></div>
      <div class="episodes-list" id="episodesList"></div>
    </div>
  </div>

  <div class="cast-status-bar" id="castStatus">
    <div class="cast-dot"></div>
    <span id="castStatusText">Diffusion en cours sur la TV</span>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // ÉTAT GLOBAL
    // ═══════════════════════════════════════════════════════════════════
    var allMovies     = [];
    var currentMovie  = null;
    var castSession   = null;
    var castAvailable = false;
    var castSdkLoaded = false;
    var currentMode   = localStorage.getItem('cinelocal-mode') || 'pc';
    var currentLang   = localStorage.getItem('cinelocal-lang') || 'all';
    var currentKind   = localStorage.getItem('cinelocal-kind') || 'all';
    var currentSeries = null;
    var currentSeason = null;

    // État Cast
    var castMoviePending  = null;
    var castTracks        = null;
    var castSelectedAudio = 0;
    var castSelectedSub   = null;
    var pendingAudioIdx   = 0;
    var pendingSubTrack   = null;

    // ═══════════════════════════════════════════════════════════════════
    // MODES & FILTRES
    // ═══════════════════════════════════════════════════════════════════
    function setMode(mode) {
      currentMode = mode;
      localStorage.setItem('cinelocal-mode', mode);
      document.querySelectorAll('.mode-btn[data-mode]').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      document.getElementById('castBtn').style.display = (mode === 'tv') ? '' : 'none';
      document.getElementById('heroPrimaryLabel').textContent =
        mode === 'tv' ? 'CASTER' : mode === 'local' ? 'TV DIRECTE' : 'LIRE';
      if (mode === 'tv' && !castSdkLoaded) loadCastSdk();
      if (mode !== 'pc') closePlayer();
      if (allMovies.length) applyFilters();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('cinelocal-lang', lang);
      document.querySelectorAll('#langToggle .mode-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      applyFilters();
    }

    function setKind(kind) {
      currentKind = kind;
      localStorage.setItem('cinelocal-kind', kind);
      document.querySelectorAll('#kindToggle .mode-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.kind === kind);
      });
      applyFilters();
    }

    function applyFilters() {
      var q = (document.getElementById('search').value || '').toLowerCase().trim();
      var filtered = allMovies;
      if (currentLang !== 'all') filtered = filtered.filter(function(m) { return m.lang === currentLang; });
      if (currentKind !== 'all') filtered = filtered.filter(function(m) { return m.kind === currentKind; });
      if (q) {
        filtered = filtered.filter(function(m) {
          return m.title.toLowerCase().includes(q) ||
                 (m.year || '').includes(q) ||
                 m.category.toLowerCase().includes(q);
        });
      }
      renderMovies(filtered);
    }

    // ═══════════════════════════════════════════════════════════════════
    // CHROMECAST SDK
    // ═══════════════════════════════════════════════════════════════════
    window['__onGCastApiAvailable'] = function(isAvailable) {
      castAvailable = isAvailable;
      console.log('[Cast] API disponible :', isAvailable);
      if (!isAvailable) return;

      var ctx = cast.framework.CastContext.getInstance();
      ctx.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
      });

      ctx.addEventListener(
        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
        function(e) {
          var S = cast.framework.SessionState;
          if (e.sessionState === S.SESSION_STARTED || e.sessionState === S.SESSION_RESUMED) {
            castSession = ctx.getCurrentSession();
            document.getElementById('castStatus').classList.add('visible');
            // Lance le film en attente si on vient d'ouvrir une session
            if (currentMovie && pendingAudioIdx !== null) {
              sendToCast(currentMovie, pendingAudioIdx, pendingSubTrack);
              pendingAudioIdx = 0;
              pendingSubTrack = null;
            }
          } else if (e.sessionState === S.SESSION_ENDED) {
            castSession = null;
            document.getElementById('castStatus').classList.remove('visible');
          }
        }
      );
    };

    function loadCastSdk() {
      if (castSdkLoaded) return;
      castSdkLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
      document.head.appendChild(s);
    }

    function sendToCast(movie, audioIdx, subTrack) {
      if (!castSession) return;

      var castUrl = (audioIdx > 0)
        ? (window.location.origin + '/cast/' + movie.id + '?audio=' + audioIdx)
        : (window.location.origin + '/cast/' + movie.id);

      var mimeMap = { '.mp4': 'video/mp4', '.mkv': 'video/x-matroska', '.webm': 'video/webm' };
      var mime = mimeMap[movie.ext] || 'video/mp4';

      var mediaInfo = new chrome.cast.media.MediaInfo(castUrl, mime);
      mediaInfo.metadata = new chrome.cast.media.MovieMediaMetadata();
      mediaInfo.metadata.title = movie.title;
      if (movie.year)   mediaInfo.metadata.releaseDate = movie.year;
      if (movie.poster) mediaInfo.metadata.images = [new chrome.cast.Image(movie.poster)];

      var activeTrackIds = [];
      if (subTrack) {
        var track = new chrome.cast.media.Track(1, chrome.cast.media.TrackType.TEXT);
        track.trackContentId  = window.location.origin + subTrack.url;
        track.trackContentType = 'text/vtt';
        track.subtype  = chrome.cast.media.TextTrackType.SUBTITLES;
        track.name     = subTrack.label;
        track.language = subTrack.language;
        mediaInfo.tracks = [track];
        activeTrackIds.push(1);
      }

      var req = new chrome.cast.media.LoadRequest(mediaInfo);
      req.activeTrackIds = activeTrackIds;

      castSession.loadMedia(req)
        .then(function() {
          var statusText = '▶ ' + movie.title;
          if (subTrack) statusText += ' — ' + subTrack.label;
          document.getElementById('castStatusText').textContent = statusText;
          console.log('[Cast] Lecture :', movie.title);
        })
        .catch(function(e) {
          console.error('[Cast] Erreur :', e);
          alert('Erreur Cast : ' + (e.description || JSON.stringify(e)));
        });
    }

    // ═══════════════════════════════════════════════════════════════════
    // MODAL OPTIONS CAST
    // ═══════════════════════════════════════════════════════════════════
    function startCast(movie) {
      // Ouvre toujours le modal de sélection (pas de check castAvailable ici)
      currentMovie = movie;
      openCastOptions(movie);
    }

    function openCastOptions(movie) {
      castMoviePending  = movie;
      castSelectedAudio = 0;
      castSelectedSub   = null;
      castTracks        = null;

      document.getElementById('castOptionsFilm').textContent = movie.title;
      document.getElementById('castOptionsBody').innerHTML =
        '<div class="cast-loading-msg">⏳ Chargement des pistes…</div>';
      document.getElementById('btnCastLaunch').disabled = true;
      document.getElementById('cast-options-modal').classList.add('open');

      fetch('/api/tracks/' + movie.id)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          castTracks = data;
          renderCastOptions();
          document.getElementById('btnCastLaunch').disabled = false;
        })
        .catch(function() {
          castTracks = { audio_tracks: [], subtitle_tracks: [] };
          renderCastOptions();
          document.getElementById('btnCastLaunch').disabled = false;
        });
    }

    function renderCastOptions() {
      if (!castTracks) return;
      var audio = castTracks.audio_tracks || [];
      var subs  = castTracks.subtitle_tracks || [];
      var html  = '';

      // Section audio
      if (audio.length > 0) {
        html += '<div class="cast-section"><div class="cast-section-label">🎵 Piste audio</div>';
        audio.forEach(function(track, i) {
          var sel      = (i === castSelectedAudio) ? 'selected' : '';
          var channels = track.channels ? (track.channels + ' canaux') : '';
          var codec    = track.codec ? track.codec.toUpperCase() : '';
          var meta     = [codec, channels].filter(Boolean).join(' · ');
          html += '<div class="cast-option-row ' + sel + '" onclick="selectCastAudio(' + i + ')">'
            + '<div class="cast-option-radio"><div class="cast-option-radio-dot"></div></div>'
            + '<div class="cast-option-text">'
            + '<div class="cast-option-name">' + escHtml(track.label) + '</div>'
            + (meta ? '<div class="cast-option-meta">' + meta + '</div>' : '')
            + '</div></div>';
        });
        html += '</div>';
      }

      // Section sous-titres
      html += '<div class="cast-section"><div class="cast-section-label">💬 Sous-titres</div>';
      var noSubSel = (castSelectedSub === null) ? 'selected' : '';
      html += '<div class="cast-option-row ' + noSubSel + '" onclick="selectCastSub(null)">'
        + '<div class="cast-option-radio"><div class="cast-option-radio-dot"></div></div>'
        + '<div class="cast-option-text"><div class="cast-option-name">Aucun sous-titre</div></div>'
        + '</div>';

      if (subs.length === 0) {
        html += '<div class="cast-empty-msg">Aucun sous-titre disponible (SRT non trouvé, PGS non supporté)</div>';
      } else {
        subs.forEach(function(sub, i) {
          var sel = (castSelectedSub === i) ? 'selected' : '';
          html += '<div class="cast-option-row ' + sel + '" onclick="selectCastSub(' + i + ')">'
            + '<div class="cast-option-radio"><div class="cast-option-radio-dot"></div></div>'
            + '<div class="cast-option-text"><div class="cast-option-name">' + escHtml(sub.label) + '</div></div>'
            + '</div>';
        });
      }
      html += '</div>';

      document.getElementById('castOptionsBody').innerHTML = html;
    }

    function selectCastAudio(idx) {
      castSelectedAudio = idx;
      renderCastOptions();
    }

    function selectCastSub(idx) {
      castSelectedSub = idx;
      renderCastOptions();
    }

    function closeCastOptions() {
      document.getElementById('cast-options-modal').classList.remove('open');
      castMoviePending = null;
    }

    function launchCast() {
      if (!castMoviePending) return;

      if (!castAvailable) {
        alert("Cast non disponible.\nAssure-toi d'utiliser Google Chrome avec le Chromecast sur le même réseau WiFi.");
        return;
      }

      var movie    = castMoviePending;
      var audioIdx = castSelectedAudio;
      var subTrack = (castSelectedSub !== null && castTracks)
        ? castTracks.subtitle_tracks[castSelectedSub]
        : null;

      closeCastOptions();

      if (castSession) {
        // Session déjà ouverte → lance directement
        sendToCast(movie, audioIdx, subTrack);
      } else {
        // Stocke les options et ouvre le sélecteur Chromecast
        pendingAudioIdx = audioIdx;
        pendingSubTrack = subTrack;
        document.getElementById('castBtn').click();
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // LECTURE PC
    // ═══════════════════════════════════════════════════════════════════
    function langToLabel(code) {
      var map = {
        'fre':'🇫🇷 Français','fra':'🇫🇷 Français','fr':'🇫🇷 Français',
        'eng':'🇬🇧 English','en':'🇬🇧 English',
        'spa':'🇪🇸 Español',
        'ger':'🇩🇪 Deutsch','deu':'🇩🇪 Deutsch',
        'ita':'🇮🇹 Italiano',
        'jpn':'🇯🇵 日本語',
        '':'Inconnue','und':'Inconnue',
      };
      return map[(code || '').toLowerCase()] || (code || '').toUpperCase();
    }

    function setLoadingState(text, substep, videoDone, tracksDone) {
      document.getElementById('loadingText').textContent    = text;
      document.getElementById('loadingSubstep').textContent = substep;
      document.getElementById('stepVideo').className  = 'loading-step' + (videoDone  ? ' done' : ' active');
      document.getElementById('stepTracks').className = 'loading-step' + (tracksDone ? ' done' : (videoDone ? ' active' : ''));
    }

    function setupAudioSelector(audioTracks) {
      var selector = document.getElementById('audioSelector');
      selector.querySelectorAll('.audio-btn').forEach(function(b) { b.remove(); });
      if (!audioTracks || audioTracks.length <= 1) {
        selector.classList.remove('visible');
        return;
      }
      selector.classList.add('visible');
      audioTracks.forEach(function(track, i) {
        var btn = document.createElement('button');
        btn.className   = 'audio-btn' + (i === 0 ? ' active' : '');
        btn.textContent = track.label || langToLabel(track.language) || ('Piste ' + (i + 1));
        btn.onclick = function() { switchAudio(i); };
        selector.appendChild(btn);
      });
    }

    function switchAudio(trackIndex) {
      if (!currentMovie) return;
      var video   = document.getElementById('player-video');
      var loading = document.getElementById('playerLoading');
      var currentTime = video.currentTime;
      var wasPaused   = video.paused;

      document.querySelectorAll('.audio-btn').forEach(function(btn, i) {
        btn.classList.toggle('active', i === trackIndex);
      });

      loading.classList.remove('hidden');
      setLoadingState('Changement de piste audio…', 'Préparation du flux', false, true);

      var url = (trackIndex === 0)
        ? ('/stream/' + currentMovie.id)
        : ('/stream/' + currentMovie.id + '?audio=' + trackIndex);

      video.src = url;
      video.load();

      video.addEventListener('loadedmetadata', function() {
        video.currentTime = currentTime;
        if (!wasPaused) {
          video.addEventListener('playing', function onPlaying() {
            setLoadingState('Prêt !', 'Lecture en cours', true, true);
            setTimeout(function() { loading.classList.add('hidden'); }, 200);
            video.removeEventListener('playing', onPlaying);
          });
          video.play().catch(function() { loading.classList.add('hidden'); });
        } else {
          loading.classList.add('hidden');
        }
      }, { once: true });

      video.addEventListener('error', function() {
        setLoadingState('Erreur', 'Impossible de charger cette piste', true, true);
        setTimeout(function() { loading.classList.add('hidden'); }, 2000);
      }, { once: true });
    }

    function attachSubtitleTracks(video, subtitleTracks) {
      video.querySelectorAll('track').forEach(function(t) { t.remove(); });
      subtitleTracks.forEach(function(sub) {
        var track = document.createElement('track');
        track.kind    = 'subtitles';
        track.src     = sub.url;
        track.srclang = sub.language;
        track.label   = sub.label;
        video.appendChild(track);
      });
      setTimeout(function() {
        for (var i = 0; i < video.textTracks.length; i++) {
          video.textTracks[i].mode = 'disabled';
        }
      }, 100);
    }

    function playLocal(movie) {
      currentMovie = movie;
      var video   = document.getElementById('player-video');
      var modal   = document.getElementById('player-modal');
      var loading = document.getElementById('playerLoading');

      document.getElementById('player-title').textContent = movie.title;
      loading.classList.remove('hidden');
      setLoadingState('Préparation du film…', 'Chargement de la vidéo et extraction des pistes', false, false);

      var selector = document.getElementById('audioSelector');
      selector.classList.remove('visible');
      selector.querySelectorAll('.audio-btn').forEach(function(b) { b.remove(); });
      video.querySelectorAll('track').forEach(function(t) { t.remove(); });

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      var movieId    = movie.id;
      var videoReady = false;
      var tracksReady = false;

      var videoPromise = new Promise(function(resolve, reject) {
        video.addEventListener('loadedmetadata', function() {
          videoReady = true;
          setLoadingState(
            tracksReady ? 'Prêt' : 'Préparation des sous-titres…',
            tracksReady ? 'Démarrage de la lecture' : 'Extraction en cours…',
            true, tracksReady
          );
          resolve();
        }, { once: true });
        video.addEventListener('error', function() { reject(new Error('Erreur vidéo')); }, { once: true });
        video.src     = '/stream/' + movieId;
        video.preload = 'auto';
        video.load();
      });

      var tracksPromise = fetch('/api/tracks/' + movieId)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          tracksReady = true;
          setLoadingState(
            videoReady ? 'Prêt' : 'Chargement de la vidéo…',
            videoReady ? 'Démarrage de la lecture' : 'Vidéo en cours de chargement',
            videoReady, true
          );
          return data;
        })
        .catch(function() { return { audio_tracks: [], subtitle_tracks: [] }; });

      Promise.all([videoPromise, tracksPromise])
        .then(function(results) {
          var tracks = results[1];
          if (!currentMovie || currentMovie.id !== movieId) return;
          setupAudioSelector(tracks.audio_tracks);
          attachSubtitleTracks(video, tracks.subtitle_tracks);
          setLoadingState('Prêt !', 'Démarrage…', true, true);
          setTimeout(function() {
            loading.classList.add('hidden');
            video.play().catch(function() {});
          }, 200);
        })
        .catch(function(e) {
          console.error('Erreur chargement :', e);
          setLoadingState('Erreur', e.message || 'Impossible de charger le film', true, true);
        });
    }

    function closePlayer() {
      var video = document.getElementById('player-video');
      video.pause();
      video.src = '';
      video.querySelectorAll('track').forEach(function(t) { t.remove(); });
      document.getElementById('player-modal').classList.remove('open');
      document.getElementById('audioSelector').classList.remove('visible');
      document.getElementById('playerLoading').classList.remove('hidden');
      document.body.style.overflow = '';
    }

    function playLocalDirect(movie) {
      fetch('/play/' + movie.id, { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) { if (data.status === 'ok') alert('▶ Lecture sur TV : ' + data.playing); })
        .catch(function(e) { alert('Erreur : ' + e); });
    }

    // ═══════════════════════════════════════════════════════════════════
    // ACTIONS
    // ═══════════════════════════════════════════════════════════════════
    function playMovie(id) {
      var m = allMovies.find(function(x) { return x.id === id; });
      if (!m) return;
      if (currentMode === 'local')   playLocalDirect(m);
      else if (currentMode === 'tv') startCast(m);
      else                           playLocal(m);
    }

    function openMovie(id) {
      var m = allMovies.find(function(x) { return x.id === id; });
      if (m) setHero(m);
    }

    function playHero() {
      if (currentMovie) playMovie(currentMovie.id);
    }

    // ═══════════════════════════════════════════════════════════════════
    // SÉRIES
    // ═══════════════════════════════════════════════════════════════════
    function openSeries(seriesId) {
      var series = allMovies.find(function(x) { return x.id === seriesId && x.kind === 'series'; });
      if (!series) return;
      currentSeries = series;
      document.getElementById('seriesModalTitle').textContent   = series.title;
      document.getElementById('seriesModalMeta').textContent    =
        series.season_count + ' saison' + (series.season_count > 1 ? 's' : '') +
        ' · ' + series.episode_count + ' épisodes · ' + series.lang.toUpperCase();
      document.getElementById('seriesModalOverview').textContent = series.overview || '';

      var headerBg = series.backdrop || series.poster;
      document.getElementById('seriesHeader').style.backgroundImage =
        headerBg ? ('url(' + headerBg + ')') : 'linear-gradient(135deg, var(--bg3), var(--surface))';

      var seasons = [...new Set(series.episodes.map(function(e) { return e.season; }))].sort(function(a,b){return a-b;});
      currentSeason = seasons[0];
      document.getElementById('seasonTabs').innerHTML = seasons.map(function(s) {
        return '<button class="season-tab ' + (s === currentSeason ? 'active' : '') +
               '" onclick="selectSeason(' + s + ')">Saison ' + String(s).padStart(2,'0') + '</button>';
      }).join('');
      renderEpisodes();
      document.getElementById('series-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function selectSeason(season) {
      currentSeason = season;
      document.querySelectorAll('.season-tab').forEach(function(t) {
        t.classList.toggle('active', t.textContent.includes(String(season).padStart(2,'0')));
      });
      renderEpisodes();
    }

    function renderEpisodes() {
      if (!currentSeries) return;
      var eps      = currentSeries.episodes.filter(function(e) { return e.season === currentSeason; });
      var btnLabel = currentMode === 'tv' ? '📺 Caster' : currentMode === 'local' ? '📽️ TV' : '▶ Lire';
      document.getElementById('episodesList').innerHTML = eps.map(function(ep) {
        return '<div class="episode-row" onclick="playEpisode(\'' + ep.id + '\')">'
          + '<div class="episode-num">E' + String(ep.episode).padStart(2,'0') + '</div>'
          + '<div class="episode-info">'
          + '<div class="episode-title">Épisode ' + ep.episode + '</div>'
          + '<div class="episode-meta">' + ep.size_mb + ' Mo · ' + ep.ext.replace('.','').toUpperCase() + '</div>'
          + '</div>'
          + '<button class="episode-play" onclick="event.stopPropagation();playEpisode(\'' + ep.id + '\')">' + btnLabel + '</button>'
          + '</div>';
      }).join('');
    }

    function playEpisode(episodeId) {
      if (!currentSeries) return;
      var ep = currentSeries.episodes.find(function(e) { return e.id === episodeId; });
      if (!ep) return;
      var fakeMovie = Object.assign({}, ep, {
        title: currentSeries.title + ' - S' + String(ep.season).padStart(2,'0') + 'E' + String(ep.episode).padStart(2,'0'),
        year: null,
        poster: currentSeries.poster,
      });
      closeSeriesModal();
      if (currentMode === 'tv')        startCast(fakeMovie);
      else if (currentMode === 'local') playLocalDirect(fakeMovie);
      else                              playLocal(fakeMovie);
    }

    function closeSeriesModal() {
      document.getElementById('series-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ═══════════════════════════════════════════════════════════════════
    // CHARGEMENT & RENDU
    // ═══════════════════════════════════════════════════════════════════
    function loadMovies() {
      fetch('/api/movies')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          allMovies = data;
          applyFilters();
          if (allMovies.length > 0) {
            setHero(allMovies[Math.floor(Math.random() * Math.min(allMovies.length, 10))]);
          }
        })
        .catch(function() {
          document.getElementById('loading').innerHTML =
            '<div style="color:var(--red)">Impossible de joindre le serveur Flask.</div>';
        });
    }

    function refreshMovies() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('movies-container').style.display = 'none';
      fetch('/api/movies/refresh')
        .then(function() { return loadMovies(); });
    }

    function renderMovies(movies) {
      document.getElementById('loading').style.display = 'none';
      var container = document.getElementById('movies-container');
      container.style.display = '';
      if (movies.length === 0) {
        document.getElementById('empty').style.display = 'block';
        container.innerHTML = '';
        return;
      }
      document.getElementById('empty').style.display = 'none';

      var byCategory = {};
      movies.forEach(function(m) {
        if (!byCategory[m.category]) byCategory[m.category] = [];
        byCategory[m.category].push(m);
      });

      container.innerHTML = Object.entries(byCategory).map(function(entry) {
        var cat = entry[0], films = entry[1];
        return '<section class="category-section">'
          + '<div class="category-title">' + cat
          + '<span class="category-count">' + films.length + ' titres</span></div>'
          + '<div class="movies-row">' + films.map(movieCard).join('') + '</div>'
          + '</section>';
      }).join('');
    }

    function movieCard(m) {
      var ext      = m.ext.replace('.','').toUpperCase();
      var isSeries = m.kind === 'series';
      var btnLabel = currentMode === 'tv' ? '📺 Caster' : currentMode === 'local' ? '📽️ TV' : '▶ Lire';
      var meta     = isSeries
        ? (m.season_count + ' saison' + (m.season_count > 1 ? 's' : '') + ' · ' + m.episode_count + ' ép.')
        : ((m.year || '') + ' · ' + m.size_mb + ' Mo');
      var action   = isSeries
        ? ("event.stopPropagation();openSeries('" + m.id + "')")
        : ("event.stopPropagation();playMovie('" + m.id + "')");
      var cardClick   = isSeries ? ("openSeries('" + m.id + "')") : ("openMovie('" + m.id + "')");
      var actionLabel = isSeries ? '📂 Voir épisodes' : btnLabel;
      var poster = m.poster
        ? ('<img class="card-thumb" src="' + m.poster + '" alt="' + escHtml(m.title) + '" loading="lazy"'
           + ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" />')
        : '';
      return '<div class="movie-card" onclick="' + cardClick + '" onmouseenter="previewHero(\'' + m.id + '\')">'
        + poster
        + '<div class="card-placeholder" style="display:' + (m.poster ? 'none' : 'flex') + '">'
        + (isSeries ? '📺' : '🎬') + '<span>' + escHtml(m.title.substring(0,30)) + '</span></div>'
        + '<div class="card-badge">' + ext + ' · ' + m.lang.toUpperCase() + '</div>'
        + (isSeries ? '<div class="series-badge">SÉRIE</div>' : '')
        + '<div class="card-info">'
        + '<div class="card-title">' + escHtml(m.title) + '</div>'
        + '<div class="card-meta">' + meta + '</div>'
        + '<div class="card-actions">'
        + '<button class="card-btn" onclick="' + action + '">' + actionLabel + '</button>'
        + '</div></div></div>';
    }

    // ═══════════════════════════════════════════════════════════════════
    // HERO
    // ═══════════════════════════════════════════════════════════════════
    var heroTimeout;
    function previewHero(id) {
      clearTimeout(heroTimeout);
      heroTimeout = setTimeout(function() {
        var m = allMovies.find(function(x) { return x.id === id; });
        if (m) setHero(m);
      }, 400);
    }

    function setHero(m) {
      currentMovie = m;
      document.getElementById('hero-title').textContent = m.title;
      document.getElementById('hero-meta').textContent  =
        [m.year, m.category !== 'Films' ? m.category : '', m.size_mb + ' Mo']
          .filter(Boolean).join(' · ');
      document.getElementById('hero-tag').textContent   = m.category;
      var bg = m.backdrop || m.poster;
      if (bg) {
        var img = new Image();
        img.onload = function() { document.getElementById('hero-bg').style.backgroundImage = 'url(' + bg + ')'; };
        img.src = bg;
      } else {
        document.getElementById('hero-bg').style.backgroundImage = '';
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // ÉVÉNEMENTS
    // ═══════════════════════════════════════════════════════════════════
    document.getElementById('search').addEventListener('input', applyFilters);

    document.getElementById('player-modal').addEventListener('click', function(e) {
      if (e.target === document.getElementById('player-modal')) closePlayer();
    });
    document.getElementById('series-modal').addEventListener('click', function(e) {
      if (e.target === document.getElementById('series-modal')) closeSeriesModal();
    });
    document.getElementById('cast-options-modal').addEventListener('click', function(e) {
      if (e.target === document.getElementById('cast-options-modal')) closeCastOptions();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closePlayer(); closeSeriesModal(); closeCastOptions(); }
    });

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // INIT
    setMode(currentMode);
    setLang(currentLang);
    setKind(currentKind);
    loadMovies();
  </script>
</body>
</html>
