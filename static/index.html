<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineLocal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --bg-room:      #1a1612;
      --bg-room-deep: #15110d;
      --fg:           #f3ead8;
      --fg-70:        rgba(243, 234, 216, 0.7);
      --fg-55:        rgba(243, 234, 216, 0.55);
      --fg-45:        rgba(243, 234, 216, 0.45);
      --fg-30:        rgba(243, 234, 216, 0.3);
      --surface-soft: rgba(243, 234, 216, 0.05);
      --surface-soft-2: rgba(243, 234, 216, 0.08);
      --surface-glass: rgba(20, 16, 12, 0.7);
      --border-hair:  rgba(243, 234, 216, 0.08);
      --border-hair-soft: rgba(243, 234, 216, 0.06);
      --accent-amber: #c2913e;
      --accent-red:   #c96442;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-room);
      color: var(--fg);
      font-family: 'Geist', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
      font-variant-numeric: oldstyle-nums;
    }

    /* ═══ ROOM WASH (page-level color bleed driven by hovered poster) ═══ */
    #room-wash {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(60% 70% at 25% 10%, #2a221a 0%, transparent 60%),
        radial-gradient(50% 60% at 80% 90%, #1f1a16 0%, transparent 65%),
        var(--bg-room);
      transition: background .55s cubic-bezier(.4, 0, .2, 1);
    }
    #room-grain {
      position: fixed; inset: 0; z-index: -1;
      pointer-events: none; opacity: 0.06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    }

    /* ═══ TOPBAR ═══ */
    .topbar {
      position: sticky; top: 0; z-index: 60;
      display: flex; align-items: center; gap: 18px;
      padding: 24px 56px 18px;
      border-bottom: 1px solid var(--border-hair-soft);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      background: rgba(26, 22, 18, 0.55);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .brand svg { color: var(--fg); }
    .brand-name {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-weight: 400; font-size: 22px;
      letter-spacing: -0.01em; color: var(--fg);
    }

    .kind-switch {
      display: flex; padding: 4px; border-radius: 999px;
      background: var(--surface-soft);
      margin: 0 auto;
    }
    .kind-pill {
      background: transparent; border: none; cursor: pointer;
      padding: 8px 18px; border-radius: 999px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--fg-70);
      transition: all .2s;
      font-variant-numeric: normal;
    }
    .kind-pill:hover:not(.active) { color: var(--fg); }
    .kind-pill.active {
      background: var(--fg);
      color: var(--bg-room);
    }

    .topbar-right {
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .search-pill {
      position: relative;
      display: flex; align-items: center;
      width: 200px;
      background: var(--surface-soft);
      border-radius: 999px;
      padding: 8px 14px 8px 36px;
    }
    .search-pill svg {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--fg-55); pointer-events: none;
    }
    .search-pill input {
      background: none; border: none; outline: none;
      color: var(--fg); font-family: inherit; font-size: 13px;
      width: 100%;
    }
    .search-pill input::placeholder { color: var(--fg-55); }

    .mini-pills {
      display: flex; padding: 3px; border-radius: 999px;
      background: var(--surface-soft);
      gap: 0;
    }
    .mini-pill {
      background: transparent; border: none; cursor: pointer;
      padding: 6px 10px; border-radius: 999px;
      font-family: inherit; font-size: 11.5px; font-weight: 500;
      color: var(--fg-55);
      letter-spacing: 0.02em;
      transition: all .15s;
      display: flex; align-items: center; gap: 4px;
      font-variant-numeric: normal;
    }
    .mini-pill:hover:not(.active) { color: var(--fg); }
    .mini-pill.active {
      background: var(--fg); color: var(--bg-room);
    }

    .icon-btn-ghost {
      background: var(--surface-soft); border: none;
      width: 32px; height: 32px; border-radius: 999px;
      color: var(--fg-70); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .icon-btn-ghost:hover { color: var(--fg); background: var(--surface-soft-2); }

    .avatar {
      width: 32px; height: 32px; border-radius: 999px;
      background: linear-gradient(135deg, #b88a48, #7a4632);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Newsreader', Georgia, serif; font-style: italic;
      font-size: 14px; color: #1a1612;
      flex-shrink: 0;
    }

    google-cast-launcher {
      --connected-color: var(--accent-amber);
      --disconnected-color: var(--fg-55);
      width: 22px; height: 22px; cursor: pointer;
    }

    /* ═══ MAIN ═══ */
    main {
      max-width: 1440px; margin: 0 auto;
      padding: 0 56px 80px;
    }

    .shelf-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-top: 36px; margin-bottom: 8px;
    }
    .shelf-header h2 {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-weight: 400; font-size: 22px;
      letter-spacing: -0.005em; color: var(--fg);
    }
    .shelf-header .count {
      font-size: 12px; color: var(--fg-45);
    }
    .shelf-header.small h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 22px;
      margin-top: 12px;
    }

    /* ═══ POSTER ═══ */
    .poster {
      position: relative;
      width: 100%; height: 252px;
      border: none; padding: 0;
      border-radius: 12px; overflow: hidden;
      cursor: pointer;
      background: var(--bg-room-deep);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 18px 32px -18px rgba(0, 0, 0, 0.55);
      transition:
        transform .35s cubic-bezier(.2, .7, .2, 1),
        box-shadow .35s,
        filter .35s;
      display: block;
      isolation: isolate;
    }
    .poster:hover { transform: translateY(-4px); }
    .poster:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    .poster.big { height: 140px; }

    .poster-bg {
      position: absolute; inset: 0; z-index: 0;
    }
    .poster-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .poster-grain {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23g)'/></svg>");
      opacity: 0.18;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .poster-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(120% 100% at 50% 100%, transparent 40%, rgba(0, 0, 0, 0.45) 100%);
      pointer-events: none;
    }
    .poster-corners {
      position: absolute; top: 10px; left: 12px; right: 12px;
      display: flex; justify-content: space-between;
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.18em; color: var(--fg-70);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      font-variant-numeric: oldstyle-nums;
    }
    .poster-title {
      position: absolute; left: 14px; right: 14px; bottom: 38px;
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-weight: 400; font-size: 22px;
      line-height: 1.05;
      color: var(--fg);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      text-wrap: pretty;
      text-align: left;
    }
    .poster.no-meta .poster-title { bottom: 14px; }
    .poster.big .poster-title { font-size: 30px; bottom: 18px; }
    .poster.has-art .poster-title { display: none; }

    .poster-meta {
      position: absolute; left: 14px; right: 14px; bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; color: var(--fg-70);
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      gap: 8px;
    }
    .poster-meta .left, .poster-meta .right {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .poster-progress {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 3px;
      background: rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .poster-progress > div {
      height: 100%;
      background: var(--fg);
    }

    /* poster with art: darker bottom gradient + show title on hover */
    .poster.has-art .poster-vignette {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 50%);
    }
    .poster.has-art .poster-title {
      display: block; opacity: 0;
      transition: opacity .25s ease;
    }
    .poster.has-art:hover .poster-title { opacity: 1; }

    /* ═══ CONTINUE WATCHING ROW ═══ */
    .continue-row {
      display: flex; gap: 18px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-top: 12px;
      scrollbar-width: thin;
    }
    .continue-tile {
      flex: 0 0 240px;
    }
    .continue-tile .poster { height: 140px; }
    .continue-tile-info {
      padding-top: 10px;
    }
    .continue-tile-title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 16px;
      line-height: 1.2; color: var(--fg);
      margin-bottom: 2px;
    }
    .continue-tile-meta {
      font-size: 11px; color: var(--fg-55);
    }

    /* ═══ NOW-HOVERING CHIP ═══ */
    .hover-chip {
      position: fixed; left: 56px; bottom: 28px;
      z-index: 50;
      display: flex; align-items: stretch; gap: 12px;
      padding: 10px 16px 10px 12px;
      max-width: 380px;
      background: var(--surface-glass);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid var(--border-hair);
      border-radius: 14px;
      opacity: 0; transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }
    .hover-chip.visible { opacity: 1; transform: translateY(0); }
    .hover-chip-bar {
      width: 6px; flex-shrink: 0; border-radius: 4px;
      align-self: stretch; min-height: 36px;
      background: var(--accent-amber);
    }
    .hover-chip-info {
      display: flex; flex-direction: column; justify-content: center;
      min-width: 0;
    }
    .hover-chip-title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 16px; color: var(--fg);
      line-height: 1.2;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hover-chip-year { color: var(--fg-55); }
    .hover-chip-meta {
      font-size: 11px; color: var(--fg-55);
      margin-top: 2px;
    }

    /* ═══ LOADING / EMPTY ═══ */
    #loading, #empty {
      padding: 8rem 56px; text-align: center;
      font-size: 13px;
      color: var(--fg-55); letter-spacing: 0.04em;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border-hair);
      border-top-color: var(--accent-amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ MOBILE BOTTOM TAB BAR ═══ */
    .tab-bar {
      display: none;
      position: fixed; left: 16px; right: 16px; bottom: 26px;
      z-index: 70;
      padding: 12px 18px;
      background: var(--surface-glass);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--border-hair);
      border-radius: 22px;
      justify-content: space-around; align-items: center;
      color: rgba(243, 234, 216, 0.5);
    }
    .tab-icon {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: rgba(243, 234, 216, 0.5);
      font-family: inherit;
      transition: color .2s;
    }
    .tab-icon.active { color: var(--fg); }
    .tab-icon span {
      font-size: 9.5px; letter-spacing: 0.02em;
    }

    /* ═══ MODALS ═══ */
    .modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(13, 10, 8, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .3s; padding: 2rem;
    }
    .modal.open { opacity: 1; pointer-events: all; }
    .icon-btn-close {
      background: var(--surface-soft-2); border: none;
      width: 36px; height: 36px; border-radius: 999px;
      color: var(--fg); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .icon-btn-close:hover { background: rgba(243, 234, 216, 0.18); }

    /* — Player modal — */
    .player-container {
      position: relative;
      width: min(92vw, 1200px);
      background: #000;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9);
      border: 1px solid var(--border-hair);
      transform: scale(0.96); transition: transform .3s;
    }
    .modal.open .player-container { transform: scale(1); }
    .player-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
    }
    .player-title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 18px; color: var(--fg);
    }
    #player-video {
      width: 100%; display: block;
      aspect-ratio: 16 / 9; background: #000;
    }
    .player-loading {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; z-index: 5;
      transition: opacity 0.4s ease;
    }
    .player-loading.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(243, 234, 216, 0.1);
      border-top-color: var(--accent-amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      font-family: 'Newsreader', Georgia, serif; font-style: italic;
      font-size: 18px; color: var(--fg);
    }
    .loading-substep {
      font-size: 12px; color: var(--fg-55);
      max-width: 400px; text-align: center;
    }
    .loading-steps { display: flex; gap: 6px; margin-top: 4px; }
    .loading-step {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(243, 234, 216, 0.2);
      transition: background 0.3s;
    }
    .loading-step.active { background: var(--accent-amber); }
    .loading-step.done { background: rgba(194, 145, 62, 0.5); }

    .audio-selector {
      position: absolute; bottom: 60px; right: 16px;
      z-index: 11; display: none; gap: 6px;
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-hair);
      padding: 10px; border-radius: 12px;
      flex-wrap: wrap; max-width: 320px;
    }
    .audio-selector.visible { display: flex; }
    .audio-selector-label {
      font-size: 10px; color: var(--fg-55);
      letter-spacing: 0.08em; text-transform: uppercase;
      width: 100%; margin-bottom: 4px;
    }
    .audio-btn {
      background: var(--surface-soft);
      border: 1px solid var(--border-hair);
      color: var(--fg); padding: 5px 10px;
      font-family: inherit; font-size: 12px;
      cursor: pointer; border-radius: 999px;
      transition: all .15s;
    }
    .audio-btn:hover { background: var(--surface-soft-2); }
    .audio-btn.active {
      background: var(--fg); color: var(--bg-room);
      border-color: var(--fg);
    }

    /* — Series modal — */
    .series-container {
      width: min(95vw, 1100px); max-height: 90vh;
      background: var(--bg-room);
      border: 1px solid var(--border-hair);
      border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column;
      transform: scale(0.96); transition: transform .3s;
    }
    .modal.open .series-container { transform: scale(1); }
    .series-header {
      position: relative; padding: 28px;
      background-size: cover; background-position: center 20%;
      min-height: 220px; display: flex; align-items: flex-end;
    }
    .series-header::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg-room) 0%, rgba(26, 22, 18, 0.4) 100%);
    }
    .series-header-content { position: relative; z-index: 1; flex: 1; }
    .series-modal-title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-weight: 400; font-size: 38px;
      letter-spacing: -0.01em; color: var(--fg);
      margin-bottom: 8px;
    }
    .series-meta {
      font-size: 12px; color: var(--accent-amber);
      letter-spacing: 0.04em; margin-bottom: 12px;
      text-transform: uppercase;
    }
    .series-overview {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 15px; color: var(--fg-70);
      max-width: 700px; line-height: 1.5;
    }
    .series-close {
      position: absolute; top: 16px; right: 16px; z-index: 2;
    }
    .season-tabs {
      display: flex; gap: 4px;
      padding: 14px 28px 0;
      border-bottom: 1px solid var(--border-hair);
      overflow-x: auto;
    }
    .season-tab {
      background: none; border: none;
      color: var(--fg-55);
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 15px;
      letter-spacing: 0.02em;
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s; white-space: nowrap;
    }
    .season-tab:hover { color: var(--fg); }
    .season-tab.active {
      color: var(--fg); border-bottom-color: var(--accent-amber);
    }
    .episodes-list {
      overflow-y: auto; padding: 14px 28px 28px;
      flex: 1;
    }
    .episode-row {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 14px;
      border-bottom: 1px solid var(--border-hair-soft);
      cursor: pointer; transition: background .15s;
      border-radius: 8px;
    }
    .episode-row:hover { background: var(--surface-soft); }
    .episode-num {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 22px;
      color: var(--accent-amber);
      min-width: 50px;
    }
    .episode-info { flex: 1; }
    .episode-title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 16px; color: var(--fg);
      margin-bottom: 2px;
    }
    .episode-meta { font-size: 11px; color: var(--fg-55); }
    .episode-play {
      background: var(--fg); color: var(--bg-room);
      border: none;
      font-family: inherit; font-size: 12px; font-weight: 500;
      letter-spacing: 0.02em;
      padding: 8px 16px;
      cursor: pointer; border-radius: 999px;
      transition: filter .15s;
    }
    .episode-play:hover { filter: brightness(1.1); }

    /* — Cast options modal — */
    .cast-options-container {
      background: var(--bg-room);
      border: 1px solid var(--border-hair);
      border-radius: 16px;
      width: min(95vw, 540px);
      overflow: hidden;
      transform: scale(0.95); transition: transform .3s;
    }
    .modal.open .cast-options-container { transform: scale(1); }
    .cast-options-header {
      padding: 22px 24px 14px;
      border-bottom: 1px solid var(--border-hair-soft);
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .cast-options-title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 22px; color: var(--fg);
    }
    .cast-options-film {
      font-size: 12px; color: var(--fg-55); margin-top: 4px;
    }
    .cast-options-body { padding: 18px 24px; max-height: 60vh; overflow-y: auto; }
    .cast-section { margin-bottom: 20px; }
    .cast-section-label {
      font-size: 11px;
      color: var(--accent-amber);
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .cast-option-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border-hair-soft);
      border-radius: 10px;
      margin-bottom: 6px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .cast-option-row:hover {
      border-color: var(--border-hair);
      background: var(--surface-soft);
    }
    .cast-option-row.selected {
      border-color: var(--accent-amber);
      background: rgba(194, 145, 62, 0.08);
    }
    .cast-option-radio {
      width: 16px; height: 16px;
      border: 2px solid var(--fg-55);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .cast-option-row.selected .cast-option-radio { border-color: var(--accent-amber); }
    .cast-option-radio-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-amber); opacity: 0;
      transition: opacity .15s;
    }
    .cast-option-row.selected .cast-option-radio-dot { opacity: 1; }
    .cast-option-text { flex: 1; }
    .cast-option-name {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-size: 15px;
      color: var(--fg);
    }
    .cast-option-meta { font-size: 11px; color: var(--fg-55); margin-top: 2px; }
    .cast-options-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-hair-soft);
      display: flex; gap: 10px; justify-content: flex-end;
    }
    .btn-ghost {
      background: none; border: 1px solid var(--border-hair);
      color: var(--fg-70); font-family: inherit;
      font-size: 13px; font-weight: 500;
      padding: 8px 16px; border-radius: 999px;
      cursor: pointer; transition: all .2s;
    }
    .btn-ghost:hover { border-color: var(--fg-70); color: var(--fg); }
    .btn-primary {
      background: var(--fg); border: none;
      color: var(--bg-room); font-family: inherit;
      font-size: 13px; font-weight: 500;
      padding: 8px 18px; border-radius: 999px;
      cursor: pointer; transition: filter .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .cast-loading-msg {
      font-size: 12px; color: var(--fg-55);
      text-align: center; padding: 20px;
    }
    .cast-empty-msg {
      font-size: 11px; color: var(--fg-55);
      padding: 6px 12px; font-style: italic;
    }

    /* ═══ CAST STATUS BAR ═══ */
    .cast-status-bar {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%); z-index: 150;
      background: var(--surface-glass);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid var(--accent-amber);
      border-radius: 999px;
      padding: 10px 18px;
      display: none; align-items: center; gap: 10px;
      font-size: 12px;
      color: var(--accent-amber);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    }
    .cast-status-bar.visible { display: flex; }
    .cast-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-amber);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ═══ SCROLLBAR ═══ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(243, 234, 216, 0.15); border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(243, 234, 216, 0.25); }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 1280px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
      .poster { height: 240px; }
    }
    @media (max-width: 768px) {
      .topbar {
        padding: 18px 20px 14px;
        flex-wrap: wrap; gap: 10px;
      }
      .kind-switch { order: 3; width: 100%; margin: 6px 0 0; }
      .kind-pill { flex: 1; padding: 8px 10px; font-size: 12.5px; }
      .search-pill { width: 140px; }
      .mini-pills { display: none; }
      .hover-chip { display: none; }
      main { padding: 0 20px 120px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .poster { height: 250px; border-radius: 14px; }
      .shelf-header h2 { font-size: 18px; }
      .tab-bar { display: flex; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 14px 16px 10px; }
      .brand-name { font-size: 18px; }
      .search-pill { width: 100px; }
      .grid { gap: 14px; }
    }
  </style>
</head>

<body>

  <div id="room-grain"></div>

  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">

        <circle cx="11" cy="19" r="1" fill="currentColor" />

        <button class="mini-pill"        data-mode="tv"    onclick="setMode('tv')"    title="Chromecast">📺</button>

        <button class="mini-pill active" data-lang="all" onclick="setLang('all')">All</button>

      <button class="icon-btn-ghost" onclick="refreshMovies()" title="Rafraîchir">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">

          <path d="M11 1v3h-3M3 13v-3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

      <google-cast-launcher id="castBtn" style="display:none"></google-cast-launcher>

        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <rect x="2" y="2" width="8" height="8" rx="1" />

      <div class="avatar">c</div>

  </header>

  <main id="library">
    <div id="loading"><div class="spinner"></div>Chargement de la bibliothèque…</div>
    <div id="empty" style="display:none">Aucun film trouvé dans ~/nvme_data</div>
    <div id="content"></div>
  </main>

  <!-- Mobile bottom tab bar -->
  <nav class="tab-bar">
    <button class="tab-icon active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">

      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">

  <!-- Now-hovering chip -->

    <div class="hover-chip-info">
      <div class="hover-chip-title">
        <span id="hoverChipTitle">…</span><span class="hover-chip-year" id="hoverChipYear"></span>
      </div>
      <div class="hover-chip-meta" id="hoverChipMeta"></div>
    </div>
  </div>

  <!-- PLAYER MODAL -->
  <div class="modal" id="player-modal">
    <div class="player-container">
      <div class="player-header">
        <div class="player-title" id="player-title"></div>
        <button class="icon-btn-close" onclick="closePlayer()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />

  <!-- CAST OPTIONS MODAL -->
  <div class="modal" id="cast-options-modal">
    <div class="cast-options-container">

          <div class="cast-options-title">Options Cast</div>

        <button class="icon-btn-close" onclick="closeCastOptions()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

  <!-- SERIES MODAL -->
  <div class="modal" id="series-modal">
    <div class="series-container">
      <div class="series-header" id="seriesHeader">
        <button class="icon-btn-close series-close" onclick="closeSeriesModal()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />

        <div class="series-header-content">
          <div class="series-modal-title" id="seriesModalTitle"></div>

  <div class="cast-status-bar" id="castStatus">
    <div class="cast-dot"></div>
    <span id="castStatusText">Diffusion en cours sur la TV</span>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // ÉTAT GLOBAL
    // ═══════════════════════════════════════════════════════════════════
    var allMovies     = [];
    var currentMovie  = null;
    var castSession   = null;
    var castAvailable = false;
    var castSdkLoaded = false;
    var currentMode   = localStorage.getItem('cinelocal-mode') || 'pc';
    var currentLang   = localStorage.getItem('cinelocal-lang') || 'all';
    var currentKind   = localStorage.getItem('cinelocal-kind') || 'all';
    var currentSeries = null;
    var currentSeason = null;
    var hoveredFilm   = null;
    var autoCycleTimer = null;

    // État Cast
    var castMoviePending  = null;
    var castTracks        = null;
    var castSelectedAudio = 0;
    var castSelectedSub   = null;
    var pendingAudioIdx   = 0;
    var pendingSubTrack   = null;

    // Progression (localStorage)
    var progressMap = JSON.parse(localStorage.getItem('cinelocal-progress') || '{}');
    function saveProgress(id, ratio) {
      if (!id) return;
      if (ratio <= 0.02 || ratio >= 0.95) {
        delete progressMap[id];
      } else {
        progressMap[id] = { p: ratio, t: Date.now() };
      }
      localStorage.setItem('cinelocal-progress', JSON.stringify(progressMap));
    }
    function getProgress(id) {
      var entry = progressMap[id];
      return entry ? entry.p : 0;
    }

    // ═══════════════════════════════════════════════════════════════════
    // PALETTE / TINT
    // ═══════════════════════════════════════════════════════════════════
    var TINT_PALETTE = [
      '#b46c3e', '#8a5a36', '#c2913e', '#7a4632',
      '#5a423a', '#6a5e58', '#6e3848', '#48242f',
      '#785a2f', '#45374e', '#3a586e', '#4a5a48',
      '#624f35', '#967a52', '#9a7a38', '#5e3820',
      '#454f30', '#6a7a4a', '#3b2b26', '#4a4a40',
      '#48352e', '#30303b', '#262321', '#3a3633',
    ];
    function hashStr(s) {
      var h = 5381;
      for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
      return Math.abs(h);
    }
    function tintFor(film) {
      var seed = film.id || film.title || '';
      return TINT_PALETTE[hashStr(String(seed)) % TINT_PALETTE.length];
    }
    function shadeHex(hex, delta) {
      var n = parseInt(hex.slice(1), 16);
      var r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
      var k = delta < 0 ? (1 + delta) : 1;
      r = Math.max(0, Math.min(255, Math.round(r * k + (delta > 0 ? 255 * delta : 0))));
      g = Math.max(0, Math.min(255, Math.round(g * k + (delta > 0 ? 255 * delta : 0))));
      b = Math.max(0, Math.min(255, Math.round(b * k + (delta > 0 ? 255 * delta : 0))));
      return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
    }

    // ═══════════════════════════════════════════════════════════════════
    // ROOM WASH (page background driven by hovered/active film)
    // ═══════════════════════════════════════════════════════════════════
    var isMobileMQ = window.matchMedia('(max-width: 768px)');
    function applyWash(film) {
      var wash = document.getElementById('room-wash');
      if (!film) {
        wash.style.background =
          'radial-gradient(60% 70% at 25% 10%, #2a221a 0%, transparent 60%),' +
          'radial-gradient(50% 60% at 80% 90%, #1f1a16 0%, transparent 65%),' +
          '#1a1612';
        return;
      }
      var t = tintFor(film);
      if (isMobileMQ.matches) {
        wash.style.background =
          'radial-gradient(80% 50% at 30% 0%, ' + t + '55 0%, transparent 60%),' +
          'radial-gradient(60% 40% at 80% 100%, ' + t + '33 0%, transparent 60%),' +
          '#1a1612';
        wash.style.transition = 'background .8s cubic-bezier(.4,0,.2,1)';
      } else {
        wash.style.background =
          'radial-gradient(60% 70% at 25% 10%, ' + t + '55 0%, transparent 60%),' +
          'radial-gradient(50% 60% at 80% 90%, ' + t + '40 0%, transparent 65%),' +
          '#1a1612';
        wash.style.transition = 'background .55s cubic-bezier(.4,0,.2,1)';
      }
    }

    function setHovered(film) {
      hoveredFilm = film;
      applyWash(film);
      var chip = document.getElementById('hoverChip');
      if (!film) {
        chip.classList.remove('visible');
        return;
      }
      var t = tintFor(film);
      document.getElementById('hoverChipBar').style.background = t;
      document.getElementById('hoverChipTitle').textContent = film.title || '';
      document.getElementById('hoverChipYear').textContent =
        film.year ? (' · ' + film.year) : '';
      var metaParts = [];
      if (film.category && film.category !== 'Films') metaParts.push(film.category);
      if (film.kind === 'series') {
        metaParts.push(
          film.season_count + ' saison' + (film.season_count > 1 ? 's' : '') +
          ' · ' + film.episode_count + ' épisodes'
        );
      } else if (film.size_mb) {
        metaParts.push(film.size_mb + ' Mo');
      }
      if (film.lang) metaParts.push(film.lang.toUpperCase());
      document.getElementById('hoverChipMeta').textContent = metaParts.join(' · ');
      chip.classList.add('visible');
    }

    // ═══════════════════════════════════════════════════════════════════
    // AUTO-CYCLE (mobile: cycle tint every 3.5s among visible films)
    // ═══════════════════════════════════════════════════════════════════
    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function startAutoCycle() {
      stopAutoCycle();
      if (!isMobileMQ.matches || prefersReduced) return;
      autoCycleTimer = setInterval(function () {
        if (hoveredFilm) return;
        var pool = getFilteredFilms();
        if (!pool.length) return;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        applyWash(pick);
      }, 3500);
    }
    function stopAutoCycle() {
      if (autoCycleTimer) { clearInterval(autoCycleTimer); autoCycleTimer = null; }
    }
    if (isMobileMQ.addEventListener) {
      isMobileMQ.addEventListener('change', function () {
        applyWash(hoveredFilm);
        startAutoCycle();
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // MODES & FILTRES
    // ═══════════════════════════════════════════════════════════════════
    function setMode(mode) {
      currentMode = mode;
      localStorage.setItem('cinelocal-mode', mode);
      document.querySelectorAll('.mini-pill[data-mode]').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      document.getElementById('castBtn').style.display = (mode === 'tv') ? '' : 'none';
      if (mode === 'tv' && !castSdkLoaded) loadCastSdk();
      if (mode !== 'pc') closePlayer();
      if (allMovies.length) applyFilters();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('cinelocal-lang', lang);
      document.querySelectorAll('.mini-pill[data-lang]').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      applyFilters();
    }

    function setKind(kind) {
      currentKind = kind;
      localStorage.setItem('cinelocal-kind', kind);
      document.querySelectorAll('.kind-pill').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.kind === kind);
      });
      applyFilters();
    }

    function getFilteredFilms() {
      var q = (document.getElementById('search').value || '').toLowerCase().trim();
      var filtered = allMovies;
      if (currentLang !== 'all') filtered = filtered.filter(function (m) { return m.lang === currentLang; });
      if (currentKind !== 'all') filtered = filtered.filter(function (m) { return m.kind === currentKind; });
      if (q) {
        filtered = filtered.filter(function (m) {
          return m.title.toLowerCase().includes(q) ||
            (m.year || '').includes(q) ||
            m.category.toLowerCase().includes(q);
        });
      }
      return filtered;
    }

    function applyFilters() {
      renderLibrary(getFilteredFilms());
      startAutoCycle();
    }

    // ═══════════════════════════════════════════════════════════════════
    // CHROMECAST SDK
    // ═══════════════════════════════════════════════════════════════════
    window['__onGCastApiAvailable'] = function (isAvailable) {
      castAvailable = isAvailable;
      if (!isAvailable) return;
      var ctx = cast.framework.CastContext.getInstance();
      ctx.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
      });
      ctx.addEventListener(
        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
        function (e) {
          var S = cast.framework.SessionState;
          if (e.sessionState === S.SESSION_STARTED || e.sessionState === S.SESSION_RESUMED) {
            castSession = ctx.getCurrentSession();
            document.getElementById('castStatus').classList.add('visible');
            if (currentMovie && pendingAudioIdx !== null) {
              sendToCast(currentMovie, pendingAudioIdx, pendingSubTrack);
              pendingAudioIdx = 0;
              pendingSubTrack = null;
            }
          } else if (e.sessionState === S.SESSION_ENDED) {
            castSession = null;
            document.getElementById('castStatus').classList.remove('visible');
          }
        }
      );
    };

    function loadCastSdk() {
      if (castSdkLoaded) return;
      castSdkLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
      document.head.appendChild(s);
    }

    function sendToCast(movie, audioIdx, subTrack) {
      if (!castSession) return;
      var castUrl = (audioIdx > 0)
        ? (window.location.origin + '/cast/' + movie.id + '?audio=' + audioIdx)
        : (window.location.origin + '/cast/' + movie.id);
      var mimeMap = { '.mp4': 'video/mp4', '.mkv': 'video/x-matroska', '.webm': 'video/webm' };
      var mime = mimeMap[movie.ext] || 'video/mp4';
      var mediaInfo = new chrome.cast.media.MediaInfo(castUrl, mime);
      mediaInfo.metadata = new chrome.cast.media.MovieMediaMetadata();
      mediaInfo.metadata.title = movie.title;
      if (movie.year)   mediaInfo.metadata.releaseDate = movie.year;
      if (movie.poster) mediaInfo.metadata.images = [new chrome.cast.Image(movie.poster)];
      var activeTrackIds = [];
      if (subTrack) {
        var track = new chrome.cast.media.Track(1, chrome.cast.media.TrackType.TEXT);
        track.trackContentId   = window.location.origin + subTrack.url;
        track.trackContentType = 'text/vtt';
        track.subtype  = chrome.cast.media.TextTrackType.SUBTITLES;
        track.name     = subTrack.label;
        track.language = subTrack.language;
        mediaInfo.tracks = [track];
        activeTrackIds.push(1);
      }
      var req = new chrome.cast.media.LoadRequest(mediaInfo);
      req.activeTrackIds = activeTrackIds;
      castSession.loadMedia(req)
        .then(function () {
          var statusText = '▶ ' + movie.title;
          if (subTrack) statusText += ' — ' + subTrack.label;
          document.getElementById('castStatusText').textContent = statusText;
        })
        .catch(function (e) {
          alert('Erreur Cast : ' + (e.description || JSON.stringify(e)));
        });
    }

    // ═══════════════════════════════════════════════════════════════════
    // CAST OPTIONS MODAL
    // ═══════════════════════════════════════════════════════════════════
    function startCast(movie) {
      currentMovie = movie;
      openCastOptions(movie);
    }
    function openCastOptions(movie) {
      castMoviePending  = movie;
      castSelectedAudio = 0;
      castSelectedSub   = null;
      castTracks        = null;
      document.getElementById('castOptionsFilm').textContent = movie.title;
      document.getElementById('castOptionsBody').innerHTML =
        '<div class="cast-loading-msg">Chargement des pistes…</div>';
      document.getElementById('btnCastLaunch').disabled = true;
      document.getElementById('cast-options-modal').classList.add('open');
      fetch('/api/tracks/' + movie.id)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          castTracks = data;
          renderCastOptions();
          document.getElementById('btnCastLaunch').disabled = false;
        })
        .catch(function () {
          castTracks = { audio_tracks: [], subtitle_tracks: [] };
          renderCastOptions();
          document.getElementById('btnCastLaunch').disabled = false;
        });
    }
    function renderCastOptions() {
      if (!castTracks) return;
      var audio = castTracks.audio_tracks || [];
      var subs  = castTracks.subtitle_tracks || [];
      var html  = '';
      if (audio.length > 0) {
        html += '<div class="cast-section"><div class="cast-section-label">Piste audio</div>';
        audio.forEach(function (track, i) {
          var sel      = (i === castSelectedAudio) ? 'selected' : '';
          var channels = track.channels ? (track.channels + ' canaux') : '';
          var codec    = track.codec ? track.codec.toUpperCase() : '';
          var meta     = [codec, channels].filter(Boolean).join(' · ');
          html += '<div class="cast-option-row ' + sel + '" onclick="selectCastAudio(' + i + ')">'
            + '<div class="cast-option-radio"><div class="cast-option-radio-dot"></div></div>'
            + '<div class="cast-option-text">'
            + '<div class="cast-option-name">' + escHtml(track.label) + '</div>'
            + (meta ? '<div class="cast-option-meta">' + meta + '</div>' : '')
            + '</div></div>';
        });
        html += '</div>';
      }
      html += '<div class="cast-section"><div class="cast-section-label">Sous-titres</div>';
      var noSubSel = (castSelectedSub === null) ? 'selected' : '';
      html += '<div class="cast-option-row ' + noSubSel + '" onclick="selectCastSub(null)">'
        + '<div class="cast-option-radio"><div class="cast-option-radio-dot"></div></div>'
        + '<div class="cast-option-text"><div class="cast-option-name">Aucun sous-titre</div></div>'
        + '</div>';
      if (subs.length === 0) {
        html += '<div class="cast-empty-msg">Aucun sous-titre disponible</div>';
      } else {
        subs.forEach(function (sub, i) {
          var sel = (castSelectedSub === i) ? 'selected' : '';
          html += '<div class="cast-option-row ' + sel + '" onclick="selectCastSub(' + i + ')">'
            + '<div class="cast-option-radio"><div class="cast-option-radio-dot"></div></div>'
            + '<div class="cast-option-text"><div class="cast-option-name">' + escHtml(sub.label) + '</div></div>'
            + '</div>';
        });
      }
      html += '</div>';
      document.getElementById('castOptionsBody').innerHTML = html;
    }
    function selectCastAudio(idx) { castSelectedAudio = idx; renderCastOptions(); }
    function selectCastSub(idx)   { castSelectedSub = idx; renderCastOptions(); }
    function closeCastOptions()   {
      document.getElementById('cast-options-modal').classList.remove('open');
      castMoviePending = null;
    }
    function launchCast() {
      if (!castMoviePending) return;
      if (!castAvailable) {
        alert("Cast non disponible.\nUtilise Google Chrome avec le Chromecast sur le même WiFi.");
        return;
      }
      var movie    = castMoviePending;
      var audioIdx = castSelectedAudio;
      var subTrack = (castSelectedSub !== null && castTracks)
        ? castTracks.subtitle_tracks[castSelectedSub] : null;
      closeCastOptions();
      if (castSession) {
        sendToCast(movie, audioIdx, subTrack);
      } else {
        pendingAudioIdx = audioIdx;
        pendingSubTrack = subTrack;
        document.getElementById('castBtn').click();
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // LECTURE PC
    // ═══════════════════════════════════════════════════════════════════
    function langToLabel(code) {
      var map = {
        'fre': '🇫🇷 Français', 'fra': '🇫🇷 Français', 'fr': '🇫🇷 Français',
        'eng': '🇬🇧 English',  'en': '🇬🇧 English',
        'spa': '🇪🇸 Español',
        'ger': '🇩🇪 Deutsch',  'deu': '🇩🇪 Deutsch',
        'ita': '🇮🇹 Italiano',
        'jpn': '🇯🇵 日本語',
        '':    'Inconnue', 'und': 'Inconnue',
      };
      return map[(code || '').toLowerCase()] || (code || '').toUpperCase();
    }

    function setLoadingState(text, substep, videoDone, tracksDone) {
      document.getElementById('loadingText').textContent    = text;
      document.getElementById('loadingSubstep').textContent = substep;
      document.getElementById('stepVideo').className  = 'loading-step' + (videoDone  ? ' done' : ' active');
      document.getElementById('stepTracks').className = 'loading-step' + (tracksDone ? ' done' : (videoDone ? ' active' : ''));
    }

    function setupAudioSelector(audioTracks) {
      var selector = document.getElementById('audioSelector');
      selector.querySelectorAll('.audio-btn').forEach(function (b) { b.remove(); });
      if (!audioTracks || audioTracks.length <= 1) {
        selector.classList.remove('visible');
        return;
      }
      selector.classList.add('visible');
      audioTracks.forEach(function (track, i) {
        var btn = document.createElement('button');
        btn.className   = 'audio-btn' + (i === 0 ? ' active' : '');
        btn.textContent = track.label || langToLabel(track.language) || ('Piste ' + (i + 1));
        btn.onclick = function () { switchAudio(i); };
        selector.appendChild(btn);
      });
    }

    function switchAudio(trackIndex) {
      if (!currentMovie) return;
      var video       = document.getElementById('player-video');
      var loading     = document.getElementById('playerLoading');
      var currentTime = video.currentTime;
      var wasPaused   = video.paused;
      document.querySelectorAll('.audio-btn').forEach(function (btn, i) {
        btn.classList.toggle('active', i === trackIndex);
      });
      loading.classList.remove('hidden');
      setLoadingState('Changement de piste audio…', 'Préparation du flux', false, true);
      var url = (trackIndex === 0)
        ? ('/stream/' + currentMovie.id)
        : ('/stream/' + currentMovie.id + '?audio=' + trackIndex);
      video.src = url; video.load();
      video.addEventListener('loadedmetadata', function () {
        video.currentTime = currentTime;
        if (!wasPaused) {
          video.addEventListener('playing', function onPlaying() {
            setLoadingState('Prêt !', 'Lecture en cours', true, true);
            setTimeout(function () { loading.classList.add('hidden'); }, 200);
            video.removeEventListener('playing', onPlaying);
          });
          video.play().catch(function () { loading.classList.add('hidden'); });
        } else {
          loading.classList.add('hidden');
        }
      }, { once: true });
      video.addEventListener('error', function () {
        setLoadingState('Erreur', 'Impossible de charger cette piste', true, true);
        setTimeout(function () { loading.classList.add('hidden'); }, 2000);
      }, { once: true });
    }

    function attachSubtitleTracks(video, subtitleTracks) {
      video.querySelectorAll('track').forEach(function (t) { t.remove(); });
      subtitleTracks.forEach(function (sub) {
        var track = document.createElement('track');
        track.kind    = 'subtitles';
        track.src     = sub.url;
        track.srclang = sub.language;
        track.label   = sub.label;
        video.appendChild(track);
      });
      setTimeout(function () {
        for (var i = 0; i < video.textTracks.length; i++) {
          video.textTracks[i].mode = 'disabled';
        }
      }, 100);
    }

    function playLocal(movie) {
      currentMovie = movie;
      var video   = document.getElementById('player-video');
      var modal   = document.getElementById('player-modal');
      var loading = document.getElementById('playerLoading');
      document.getElementById('player-title').textContent = movie.title;
      loading.classList.remove('hidden');
      setLoadingState('Préparation du film…', 'Chargement de la vidéo et extraction des pistes', false, false);
      var selector = document.getElementById('audioSelector');
      selector.classList.remove('visible');
      selector.querySelectorAll('.audio-btn').forEach(function (b) { b.remove(); });
      video.querySelectorAll('track').forEach(function (t) { t.remove(); });
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      var movieId    = movie.id;
      var videoReady = false;
      var tracksReady = false;
      var videoPromise = new Promise(function (resolve, reject) {
        video.addEventListener('loadedmetadata', function () {
          videoReady = true;
          setLoadingState(
            tracksReady ? 'Prêt' : 'Préparation des sous-titres…',
            tracksReady ? 'Démarrage de la lecture' : 'Extraction en cours…',
            true, tracksReady
          );
          var saved = getProgress(movieId);
          if (saved > 0 && video.duration) {
            video.currentTime = saved * video.duration;
          }
          resolve();
        }, { once: true });
        video.addEventListener('error', function () { reject(new Error('Erreur vidéo')); }, { once: true });
        video.src     = '/stream/' + movieId;
        video.preload = 'auto';
        video.load();
      });
      var tracksPromise = fetch('/api/tracks/' + movieId)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          tracksReady = true;
          setLoadingState(
            videoReady ? 'Prêt' : 'Chargement de la vidéo…',
            videoReady ? 'Démarrage de la lecture' : 'Vidéo en cours de chargement',
            videoReady, true
          );
          return data;
        })
        .catch(function () { return { audio_tracks: [], subtitle_tracks: [] }; });
      Promise.all([videoPromise, tracksPromise])
        .then(function (results) {
          var tracks = results[1];
          if (!currentMovie || currentMovie.id !== movieId) return;
          setupAudioSelector(tracks.audio_tracks);
          attachSubtitleTracks(video, tracks.subtitle_tracks);
          setLoadingState('Prêt !', 'Démarrage…', true, true);
          setTimeout(function () {
            loading.classList.add('hidden');
            video.play().catch(function () {});
          }, 200);
        })
        .catch(function (e) {
          setLoadingState('Erreur', e.message || 'Impossible de charger le film', true, true);
        });
    }

    function closePlayer() {
      var video = document.getElementById('player-video');
      if (currentMovie && video.duration) {
        saveProgress(currentMovie.id, video.currentTime / video.duration);
      }
      video.pause();
      video.src = '';
      video.querySelectorAll('track').forEach(function (t) { t.remove(); });
      document.getElementById('player-modal').classList.remove('open');
      document.getElementById('audioSelector').classList.remove('visible');
      document.getElementById('playerLoading').classList.remove('hidden');
      document.body.style.overflow = '';
      // re-render to surface continue-watching row
      if (allMovies.length) applyFilters();
    }

    document.getElementById('player-video').addEventListener('timeupdate', function () {
      var v = this;
      if (!currentMovie || !v.duration) return;
      if (Math.floor(v.currentTime) % 5 !== 0) return;
      saveProgress(currentMovie.id, v.currentTime / v.duration);
    });

    function playLocalDirect(movie) {
      fetch('/play/' + movie.id, { method: 'POST' })
        .then(function (r) { return r.json(); })
        .then(function (data) { if (data.status === 'ok') console.log('▶ Lecture TV : ' + data.playing); })
        .catch(function (e) { alert('Erreur : ' + e); });
    }
    function stopLocal() {
      fetch('/stop', { method: 'POST' }).catch(function () {});
    }

    // ═══════════════════════════════════════════════════════════════════
    // ACTIONS
    // ═══════════════════════════════════════════════════════════════════
    function playMovie(id) {
      var m = allMovies.find(function (x) { return x.id === id; });
      if (!m) return;
      if (currentMode === 'local')   playLocalDirect(m);
      else if (currentMode === 'tv') startCast(m);
      else                           playLocal(m);
    }

    function openMovie(id) {
      var m = findFilm(id);
      if (!m) return;
      if (m.kind === 'series') openSeries(id);
      else                     playMovie(id);
    }
    function findFilm(id) {
      return allMovies.find(function (x) { return x.id === id; });
    }

    // ═══════════════════════════════════════════════════════════════════
    // SÉRIES
    // ═══════════════════════════════════════════════════════════════════
    function openSeries(seriesId) {
      var series = allMovies.find(function (x) { return x.id === seriesId && x.kind === 'series'; });
      if (!series) return;
      currentSeries = series;
      document.getElementById('seriesModalTitle').textContent = series.title;
      document.getElementById('seriesModalMeta').textContent  =
        series.season_count + ' saison' + (series.season_count > 1 ? 's' : '') +
        ' · ' + series.episode_count + ' épisodes · ' + series.lang.toUpperCase();
      document.getElementById('seriesModalOverview').textContent = series.overview || '';
      var headerBg = series.backdrop || series.poster;
      document.getElementById('seriesHeader').style.backgroundImage =
        headerBg ? ('url(' + headerBg + ')')
                 : 'linear-gradient(155deg, ' + tintFor(series) + ' 0%, ' + shadeHex(tintFor(series), -0.35) + ' 100%)';
      var seasons = [...new Set(series.episodes.map(function (e) { return e.season; }))].sort(function (a, b) { return a - b; });
      currentSeason = seasons[0];
      document.getElementById('seasonTabs').innerHTML = seasons.map(function (s) {
        return '<button class="season-tab ' + (s === currentSeason ? 'active' : '') +
          '" onclick="selectSeason(' + s + ')">Saison ' + String(s).padStart(2, '0') + '</button>';
      }).join('');
      renderEpisodes();
      document.getElementById('series-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function selectSeason(season) {
      currentSeason = season;
      document.querySelectorAll('.season-tab').forEach(function (t) {
        t.classList.toggle('active', t.textContent.includes(String(season).padStart(2, '0')));
      });
      renderEpisodes();
    }

    function renderEpisodes() {
      if (!currentSeries) return;
      var eps      = currentSeries.episodes.filter(function (e) { return e.season === currentSeason; });
      var btnLabel = currentMode === 'tv' ? 'Caster' : currentMode === 'local' ? 'TV' : 'Lire';
      document.getElementById('episodesList').innerHTML = eps.map(function (ep) {
        return '<div class="episode-row" onclick="playEpisode(\'' + ep.id + '\')">'
          + '<div class="episode-num">E' + String(ep.episode).padStart(2, '0') + '</div>'
          + '<div class="episode-info">'
          + '<div class="episode-title">Épisode ' + ep.episode + '</div>'
          + '<div class="episode-meta">' + ep.size_mb + ' Mo · ' + ep.ext.replace('.', '').toUpperCase() + '</div>'
          + '</div>'
          + '<button class="episode-play" onclick="event.stopPropagation();playEpisode(\'' + ep.id + '\')">' + btnLabel + '</button>'
          + '</div>';
      }).join('');
    }

    function playEpisode(episodeId) {
      if (!currentSeries) return;
      var ep = currentSeries.episodes.find(function (e) { return e.id === episodeId; });
      if (!ep) return;
      var fakeMovie = Object.assign({}, ep, {
        title:  currentSeries.title + ' - S' + String(ep.season).padStart(2, '0') + 'E' + String(ep.episode).padStart(2, '0'),
        year:   null,
        poster: currentSeries.poster,
      });
      closeSeriesModal();
      if (currentMode === 'tv')         startCast(fakeMovie);
      else if (currentMode === 'local') playLocalDirect(fakeMovie);
      else                              playLocal(fakeMovie);
    }

    function closeSeriesModal() {
      document.getElementById('series-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ═══════════════════════════════════════════════════════════════════
    // CHARGEMENT & RENDU
    // ═══════════════════════════════════════════════════════════════════
    function loadMovies() {
      fetch('/api/movies')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          allMovies = data;
          applyFilters();
        })
        .catch(function () {
          document.getElementById('loading').innerHTML =
            '<div style="color:var(--accent-red)">Impossible de joindre le serveur Flask.</div>';
        });
    }

    function refreshMovies() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      fetch('/api/movies/refresh')
        .then(function () { return loadMovies(); });
    }

    function renderLibrary(films) {
      document.getElementById('loading').style.display = 'none';
      var container = document.getElementById('content');
      container.style.display = '';
      if (films.length === 0) {
        document.getElementById('empty').style.display = 'block';
        container.innerHTML = '';
        return;
      }
      document.getElementById('empty').style.display = 'none';

      var html = '';

      // Continue watching: latest 8 films with stored progress (0 < p < 1)
      var continueFilms = allMovies
        .map(function (m) { return { m: m, p: getProgress(m.id), t: (progressMap[m.id] || {}).t || 0 }; })
        .filter(function (x) { return x.p > 0 && x.p < 1; })
        .sort(function (a, b) { return b.t - a.t; })
        .slice(0, 8)
        .map(function (x) { return x.m; });
      if (continueFilms.length) {
        html += '<div class="shelf-header small"><h2>Continue watching</h2></div>';
        html += '<div class="continue-row">';
        continueFilms.forEach(function (f) {
          html += '<div class="continue-tile">' + posterHtml(f, { big: true, showMeta: false }) + '</div>';
        });
        html += '</div>';
      }

      var headerCopy = currentKind === 'tv'    ? 'Series on the Shelf'
                     : currentKind === 'movie' ? 'In the Library'
                     :                           'The Library';
      html += '<div class="shelf-header"><h2>' + headerCopy + '</h2>'
        + '<span class="count">' + films.length + ' titres</span></div>';
      html += '<div class="grid">';
      films.forEach(function (f) { html += posterHtml(f, {}); });
      html += '</div>';

      container.innerHTML = html;
      bindPosterEvents();
    }

    function posterHtml(film, opts) {
      opts = opts || {};
      var big      = !!opts.big;
      var showMeta = opts.showMeta !== false;
      var tint     = tintFor(film);
      var dark     = shadeHex(tint, -0.35);
      var hasArt   = !!film.poster;
      var year     = film.year || '';
      var kindBadge = film.kind === 'series' ? 'Series' : 'Feature';
      var leftMeta  = (film.category && film.category !== 'Films')
        ? film.category : (film.kind === 'series' ? 'Series' : 'Film');
      var rightMeta = film.kind === 'series'
        ? (film.episode_count + ' ép.')
        : (film.size_mb ? (film.size_mb + ' Mo') : '');
      var prog = getProgress(film.id);
      var bgStyle = hasArt
        ? ''
        : ('background: linear-gradient(155deg, ' + tint + ' 0%, ' + dark + ' 100%);');
      var artHtml = hasArt
        ? ('<img class="poster-img" src="' + film.poster + '" alt="' + escAttr(film.title) + '" loading="lazy" />')
        : '';
      var classes = 'poster'
        + (big ? ' big' : '')
        + (hasArt ? ' has-art' : '')
        + (showMeta ? '' : ' no-meta');
      return '<button class="' + classes + '"'
        + ' data-id="' + escAttr(film.id) + '"'
        + ' data-tint="' + tint + '">'
        + '<div class="poster-bg" style="' + bgStyle + '"></div>'
        + artHtml
        + '<div class="poster-grain"></div>'
        + '<div class="poster-vignette"></div>'
        + '<div class="poster-corners"><span>' + kindBadge + '</span><span>' + (year || '') + '</span></div>'
        + '<div class="poster-title">' + escHtml(film.title) + '</div>'
        + (showMeta
          ? '<div class="poster-meta"><span class="left">' + escHtml(leftMeta) + '</span><span class="right">' + escHtml(rightMeta) + '</span></div>'
          : '')
        + (prog > 0 && prog < 1
          ? '<div class="poster-progress"><div style="width:' + (prog * 100).toFixed(1) + '%"></div></div>'
          : '')
        + '</button>';
    }

    function bindPosterEvents() {
      document.querySelectorAll('.poster').forEach(function (btn) {
        var id = btn.dataset.id;
        btn.addEventListener('mouseenter', function () {
          var f = findFilm(id) || findEpisodeOrFilm(id);
          if (f) setHovered(f);
        });
        btn.addEventListener('mouseleave', function () { setHovered(null); });
        btn.addEventListener('click', function () {
          var f = findFilm(id);
          if (!f) return;
          if (isMobileMQ.matches) {
            // First tap on mobile pins the tint; second tap opens.
            if (hoveredFilm && hoveredFilm.id === id) {
              openMovie(id);
            } else {
              setHovered(f);
            }
          } else {
            openMovie(id);
          }
        });
        btn.addEventListener('focus', function () {
          var f = findFilm(id);
          if (f) setHovered(f);
        });
      });
    }
    function findEpisodeOrFilm(id) {
      var top = findFilm(id);
      if (top) return top;
      for (var i = 0; i < allMovies.length; i++) {
        var m = allMovies[i];
        if (m.episodes) {
          var ep = m.episodes.find(function (e) { return e.id === id; });
          if (ep) return ep;
        }
      }
      return null;
    }

    // ═══════════════════════════════════════════════════════════════════
    // ÉVÉNEMENTS GLOBAUX
    // ═══════════════════════════════════════════════════════════════════
    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('player-modal').addEventListener('click', function (e) {
      if (e.target === document.getElementById('player-modal')) closePlayer();
    });
    document.getElementById('series-modal').addEventListener('click', function (e) {
      if (e.target === document.getElementById('series-modal')) closeSeriesModal();
    });
    document.getElementById('cast-options-modal').addEventListener('click', function (e) {
      if (e.target === document.getElementById('cast-options-modal')) closeCastOptions();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closePlayer(); closeSeriesModal(); closeCastOptions(); }
    });

    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escAttr(s) { return escHtml(s); }

    // INIT
    setMode(currentMode);
    setLang(currentLang);
    setKind(currentKind);
    loadMovies();
  </script>
</body>
